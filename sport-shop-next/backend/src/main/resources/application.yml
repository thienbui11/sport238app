server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 12h
      cookie:
        name: SID
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # đặt true khi chạy sau HTTPS
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportshop}
    username: ${DB_USER:sportshop}
    password: ${DB_PASSWORD:sportshop}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
shop:
  admin-password: ${ADMIN_PASSWORD:}          # để trống thì dùng admin123 (chỉ để chạy thử)
  upload-dir: ${UPLOAD_DIR:./uploads}
  shop-name: ${SHOP_NAME:SPORT 238}
  messenger-user: ${MESSENGER_USER:Sport238}
  zalo-phone: ${ZALO_PHONE:0962374770}
