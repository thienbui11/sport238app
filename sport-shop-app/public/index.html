<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>/* ===== MÀU SẮC theo logo SPORT 238 (đỏ đô + xám đen). Đổi màu chủ đạo chỉ cần sửa các biến ở đây ===== */
:root{--accent:#a3122a;--accent2:#7f0d1f;--soft:#fbe9ec;--bg:#faf6f6;--surface:#fff;--ink:#1f1d1e;--muted:#6b6264;--line:#ecdfe1;--on:#fff;--dark:#232326;--danger:#e11d48;--warn:#b45309;--warnbg:#fef3c7;
--blob1:#f2a3ab;--blob2:#a3122a;--shadow:0 12px 32px -16px rgba(120,20,35,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#d93a50;--accent2:#ff9aa6;--soft:#3a1a20;--bg:#151213;--surface:#1f1a1b;--ink:#f3eeee;--muted:#b3a8aa;--line:#3a2b2e;--dark:#0f0d0e;--warnbg:#3b2f10;--warn:#fbbf24;--blob1:#7a1626}}
:root[data-theme="dark"]{--accent:#d93a50;--accent2:#ff9aa6;--soft:#3a1a20;--bg:#151213;--surface:#1f1a1b;--ink:#f3eeee;--muted:#b3a8aa;--line:#3a2b2e;--dark:#0f0d0e;--warnbg:#3b2f10;--warn:#fbbf24;--blob1:#7a1626}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font,"Be Vietnam Pro"),system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}img{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
/* thanh trên cùng + menu */
[hidden]{display:none!important}
.strip{background:var(--dark);font-size:13px;color:#d6cfd1}.strip .wrap{display:flex;justify-content:flex-end;align-items:center;gap:14px;min-height:36px}
.strip a{text-decoration:none;font-weight:600;color:#fff;white-space:nowrap}.strip .addr{margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.pal{display:flex;gap:6px;align-items:center;margin-right:auto}
.pal button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:1px 10px;font-size:12px}.pal button[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--accent2);text-decoration:none;margin-right:auto}.logo img{border-radius:50%;display:block}
.menu{display:flex;gap:2px;position:absolute;left:50%;transform:translateX(-50%);width:max-content}
.menu a{text-decoration:none;font-weight:600;padding:8px 12px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--ink)}.menu a.on{border-color:var(--accent)}
.cartbtn{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:21px;display:grid;place-items:center}
.cartbtn b{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;border-radius:99px;background:var(--danger);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;align-items:center;padding:56px 0 30px}
.pill{display:inline-block;background:var(--soft);color:var(--accent2);font-weight:600;font-size:14px;padding:7px 16px;border-radius:99px}
.hero h1{font-size:clamp(34px,5.4vw,62px);line-height:1.08;font-weight:800;margin:18px 0 16px;letter-spacing:-.02em}.hl{color:var(--accent)}
.hero p{font-size:19px;color:var(--ink);margin:0 0 26px;max-width:30em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--accent);background:var(--accent);color:var(--on);font-weight:700;padding:15px 34px;border-radius:99px;text-decoration:none;box-shadow:0 10px 24px -10px var(--accent)}
.btn.ghost{background:transparent;color:var(--accent2);box-shadow:none}.btn:disabled{opacity:.5;cursor:default}
.art{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin:0 auto}
.art .b1{position:absolute;inset:6% 0 0 8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--blob1),var(--blob2));box-shadow:inset -20px -20px 50px rgba(255,255,255,.25)}
.art .b2{position:absolute;left:0;bottom:4%;width:42%;aspect-ratio:1;border-radius:50%;background:var(--soft);opacity:.95}
.art span{position:absolute;font-size:clamp(40px,7vw,78px);filter:drop-shadow(0 10px 14px rgba(0,0,0,.18));animation:fl 5s ease-in-out infinite}
.art .e1{left:38%;top:28%;font-size:clamp(80px,13vw,140px)}.art .e2{right:6%;top:50%;animation-delay:-1.5s}.art .e3{left:26%;bottom:6%;animation-delay:-3s}.art .e4{right:4%;top:14%;font-size:44px;animation-delay:-2s}
@keyframes fl{50%{transform:translateY(-10px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:10px 0 20px}
.stat{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px 12px;text-align:center}.stat b{display:block;font-size:30px;font-weight:800;color:var(--accent);line-height:1.2}.stat span{font-size:14px;color:var(--muted)}
/* sản phẩm */
.sec{padding-top:56px;padding-bottom:8px}.sec h2{font-size:clamp(30px,4.6vw,44px);font-weight:800;text-align:center;margin:0 0 8px;letter-spacing:-.01em}.sec .sub{text-align:center;color:var(--muted);margin:0 0 26px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:0 20px}.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;padding:14px 0;outline:none;min-width:0}
.sel{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:13px 22px;font:inherit}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin;scrollbar-color:var(--accent) var(--soft)}
.chip{flex:none;display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 22px;font-weight:600}.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.count{color:var(--muted);font-size:14px;margin:4px 4px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}.card:hover{transform:translateY(-4px)}
.thumb{position:relative;display:block;aspect-ratio:1;overflow:hidden;text-decoration:none}.thumb img,.ph{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font-size:76px;transition:transform .4s}
.card:hover .thumb img,.card:hover .ph{transform:scale(1.06)}
.badge{position:absolute;top:12px;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--soft);color:var(--accent2);z-index:1}
.badge.l{left:12px}.badge.r{right:12px;background:var(--accent);color:var(--on)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.out{background:#e5e7eb;color:#4b5563}
.cinfo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}.cinfo small{color:var(--muted)}
.cinfo h3{font-size:17px;font-weight:700;line-height:1.3;margin:0;min-height:44px}.price{font-size:20px;font-weight:800;color:var(--accent);margin:6px 0 10px}
.cinfo .btn{width:100%;padding:11px;font-size:15px;margin-top:auto;box-shadow:none;border-radius:14px}

  var sh=Object.keys(g).map(function(k){return '<div class="lab">'+(k||"Chọn size")+'</div><div class="opts">'+g[k].map(function(s){var vv=p.vs.find(function(x){return x.color===sel.c&&x.size===s}),out=!vv||vv.stock<=0;if(out)anyOut=true;return '<button class="opt'+(out?' out':'')+'" data-sz="'+esc(s)+'" aria-pressed="'+(sel.s===s)+'"'+(out?' title="Tạm hết hàng"':'')+'>'+esc(s)+'<small>'+(vv&&vv.stock>0?'còn '+vv.stock:'hết')+'</small></button>'}).join("")+'</div>'}).join("")+(anyOut?'<div class="legend">Size gạch chéo là tạm hết hàng. Bạn vẫn có thể nhắn shop để hỏi.</div>':'');
  var needInfo=!ns&&NEEDSIZE.indexOf(p.cat)>-1?'<div class="note">Chưa có thông tin size của sản phẩm này. Vui lòng nhắn shop để được tư vấn size.</div>':'';
  var ch=p.colors.length>1?'<div class="lab">'+(optLbl(p)==="Màu"?"Màu sắc":"Phân loại")+': <small>'+esc(sel.c)+'</small></div><div class="opts">'+p.colors.map(function(c){return '<button class="opt" data-col="'+esc(c)+'" aria-pressed="'+(c===sel.c)+'">'+esc(c)+'<small>'+(colStock(p,c)?'còn '+colStock(p,c):'hết')+'</small></button>'}).join("")+'</div>':(p.colors[0]!=="Mặc định"?'<div class="lab">'+(optLbl(p)==="Màu"?"Màu sắc":"Phân loại")+': <small>'+esc(p.colors[0])+'</small></div>':"");
  var stt=!v?(ns?"Tồn kho"+(p.colors.length>1?" "+optLbl(p).toLowerCase()+" này":"")+": "+colStock(p,sel.c)+" sản phẩm. Chọn size để xem từng size.":"Tạm hết hàng"):v.stock<=0?"Tạm hết hàng. Nhắn shop để hỏi khi nào có hàng.":"Còn "+v.stock+" sản phẩm";
  var bad=v&&v.stock<=0||(!v&&!ns);
  $("#app").innerHTML='<div class="wrap"><a class="back" href="#san-pham">← Tất cả sản phẩm</a><div class="det"><div class="gal"><div class="main">'+mainImg(p,sel)+'</div>'+thumbsHtml(p,sel)+'</div><div><span class="pill">'+esc(p.cat)+(p.brand?' · '+esc(p.brand):'')+'</span><h1>'+esc(p.name)+'</h1><div class="bigp">'+(v?money(v.price):priceTxt(p))+'</div>'+ch+sh+needInfo+'<div class="st'+(bad?' out':'')+'">'+stt+(v?' · Mã '+esc(v.sku):'')+'</div>'+(p.desc?'<p class="desc" style="margin:0 0 12px;color:var(--ink)">'+esc(p.desc)+'</p>':'')+'<p class="desc" style="font-size:13px">'+(CFG.updated?'Tồn kho cập nhật ngày '+esc(CFG.updated)+'. ':'')+'Shop xác nhận còn hàng khi chốt đơn.</p><button class="btn" id="ad"'+(v&&v.stock<=0?' disabled':'')+'>+ Thêm vào giỏ hàng</button><a class="btn ghost" data-fb target="_blank" rel="noopener">Hỏi shop về sản phẩm này</a><div class="pick" style="margin-top:14px">📍 Ghé shop nhận hàng: '+esc(CFG.addr)+'</div></div></div></div>';
  links();all("[data-i]").forEach(function(b){b.onclick=function(){sel.i=+b.dataset.i;draw()}});all("[data-sz]").forEach(function(b){b.onclick=function(){sel.s=b.dataset.sz;draw()}});
  all("[data-col]").forEach(function(b){b.onclick=function(){sel.c=b.dataset.col;sel.i=0;if(ns&&!p.vs.some(function(x){return x.color===sel.c&&x.size===sel.s&&x.stock>0}))sel.s=null;draw()}});
  $("#ad").onclick=function(){var x=find();if(!x){toast(ns?"Bạn chưa chọn size":"Sản phẩm tạm hết hàng");return}if(x.stock<=0)return;var lb=[];if(x.size)lb.push("Size "+x.size);if(p.colors.length>1)lb.push(optLbl(p)+" "+x.color);add(x.id,lb.join(" · "))}}
 draw()}

 all("[data-zl]").forEach(function(a){a.href=z});all("[data-fb]").forEach(function(a){a.href=m});all("[data-fp]").forEach(function(a){a.href=f});all("[data-map]").forEach(function(a){a.href=mp})}
var io;function spy(){if(io)io.disconnect();if(!("IntersectionObserver" in window))return;io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)all(".menu a").forEach(function(a){a.classList.toggle("on",a.dataset.s===e.target.id)})})},{rootMargin:"-45% 0px -50% 0px"});["top","danh-muc","san-pham","ve-shop","cach-mua"].forEach(function(i){var el=document.getElementById(i);if(el)io.observe(el)})}

 if(m){view="d";if(io)io.disconnect();all(".menu a").forEach(function(a){a.classList.remove("on")});detail(decodeURIComponent(m[1]));window.scrollTo(0,0);return}
 if(view!=="h"){view="h";home()}var id=h.slice(1),el=id&&document.getElementById(id);if(el)el.scrollIntoView();else window.scrollTo(0,0)}

 $("#sad").textContent="📍 "+CFG.addr;$("#fad").textContent="📍 "+CFG.addr;$("#dpick").textContent="📍 Ghé shop nhận hàng: "+CFG.addr+". Shop sẽ nhắn xác nhận và giữ hàng cho bạn ❤️"}
